<!DOCTYPE html>
<html>
    <head>
        <title>Intro to JavaScript</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <header>
            <h1> Assignment 05</h1>
            <h2> Introduction to JavaScript</h2>
        </header>
        <div id="action-squares" class="columns">
            <div id="speech-square" class="one">
                <h3>Speech</h3>
                <div id="speech-bubble" class="bubble"></div>
            </div>

            <div id="beverage-square" class="one">
                <h3>Beverage</h3>
                <label for="beverage">Pick your morning beverage:</label>
                <select id="beverage-select" name="beverage">
                <option value="coffee">Coffee</option>
                <option value="orange-juice">Orange Juice</option>
                <option value="matcha">Matcha</option> <!-- "selected" makes this the default -->
                <option value="tea">Tea</option>
                </select>
                <div id="dropdown-message"></div>

            </div>
            
            <div id="sticker-square" class = "one">
                <h3>Add a Sticker</h3>
                <img id = "big-sun" src="emoji/sun-emoji.png"/>
                <div class="sticker">
                    <img id="cloud-sticker" src="emoji/cloud-sticker.webp" alt="cloud" />
                </div>
            
             </div>
            </div>
        </div>
     
        <script src="script.js"></script>
    </body>

</html>
